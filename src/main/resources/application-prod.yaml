# Production overrides.
# Activate with SPRING_PROFILES_ACTIVE=prod.
# Append debug after prod only for temporary SQL troubleshooting.
spring:
  config:
    activate:
      # Apply this file only when the prod profile is active.
      on-profile: prod
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}
  datasource:
    # Production must provide database settings through environment variables or secrets.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Production pool sizing can be tuned per deployment.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}

  flyway:
    # Production should validate migrations before applying them.
    validate-on-migrate: true
    # Do not silently baseline an existing production schema.
    baseline-on-migrate: false

  jpa:
    hibernate:
      # Production schema changes must come only from Flyway.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

server:
  error:
    # Never leak implementation details in production error responses.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoint:
    health:
      # Keep production health details hidden unless Spring Security authorizes the caller.
      show-details: when_authorized

springdoc:
  api-docs:
    # Disable public API docs in production unless explicitly enabled.
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    # Disable Swagger UI in production unless explicitly enabled.
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging:
  structured:
    format:
      # Emit JSON to container stdout so Loki retains fields instead of parsing
      # a free-form message. Development keeps the compact human-readable format.
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: prod
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.gyro.api: ${APP_LOG_LEVEL:INFO}
    org.springframework: WARN
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

gyro:
  email:
    from: ${MAIL_FROM}
  verification:
    email-provider: ${GYRO_VERIFICATION_EMAIL_PROVIDER:smtp}
    sms-provider: ${GYRO_VERIFICATION_SMS_PROVIDER:log-only}
    allow-code-logging: ${GYRO_VERIFICATION_ALLOW_CODE_LOGGING:false}

app:
  trial:
    # Fail-safe production default: trials stay off until explicitly enabled
    # (only after the downgrade policy is live -- see the rollout runbook).
    enabled: ${TRIAL_ENABLED:false}
    # Dedicated secret in production; no JWT fallback here.
    identifier-pepper: ${TRIAL_IDENTIFIER_PEPPER}
  notification:
    endpoint-fingerprint-key: ${NOTIFICATION_ENDPOINT_FINGERPRINT_KEY}
    push-subscription-encryption-key: ${NOTIFICATION_PUSH_SUBSCRIPTION_ENCRYPTION_KEY}
    telegram-linking-enabled: ${NOTIFICATION_TELEGRAM_LINKING_ENABLED:false}
    telegram-bot-username: ${NOTIFICATION_TELEGRAM_BOT_USERNAME:}
    telegram-webhook-secret: ${NOTIFICATION_TELEGRAM_WEBHOOK_SECRET:}
    telegram-endpoint-encryption-key: ${NOTIFICATION_TELEGRAM_ENDPOINT_ENCRYPTION_KEY:}
    telegram-link-token-ttl: ${NOTIFICATION_TELEGRAM_LINK_TOKEN_TTL:10m}
    telegram-link-data-retention: ${NOTIFICATION_TELEGRAM_LINK_DATA_RETENTION:7d}
    telegram-cleanup-batch-size: ${NOTIFICATION_TELEGRAM_CLEANUP_BATCH_SIZE:500}
    web-push-enabled: ${NOTIFICATION_WEB_PUSH_ENABLED:false}
    web-push-public-key: ${NOTIFICATION_WEB_PUSH_PUBLIC_KEY:}
    web-push-private-key: ${NOTIFICATION_WEB_PUSH_PRIVATE_KEY:}
    web-push-subject: ${NOTIFICATION_WEB_PUSH_SUBJECT:mailto:info@gyrohealth.ir}
    web-push-allowed-endpoint-hosts: ${NOTIFICATION_WEB_PUSH_ALLOWED_ENDPOINT_HOSTS:fcm.googleapis.com,updates.push.services.mozilla.com,push.services.mozilla.com,web.push.apple.com,.notify.windows.com}
    web-push-max-subscriptions-per-user: ${NOTIFICATION_WEB_PUSH_MAX_SUBSCRIPTIONS_PER_USER:10}
    web-push-timeout: ${NOTIFICATION_WEB_PUSH_TIMEOUT:10s}
    email-enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    product-sms-enabled: ${NOTIFICATION_PRODUCT_SMS_ENABLED:false}
    product-sms-api-key: ${NOTIFICATION_PRODUCT_SMS_API_KEY:}
    product-sms-line-number: ${NOTIFICATION_PRODUCT_SMS_LINE_NUMBER:}
  seed:
    # Production catalog and prices are Flyway/admin managed. Explicit opt-in is required only
    # for controlled bootstrap recovery; the runner never rewrites an existing price.
    enabled: ${SEED_ENABLED:false}
  admin-user-deletion:
    # Permanent deletion remains opt-in and restricted to explicitly allowlisted operators.
    enabled: ${ADMIN_USER_DELETION_ENABLED:false}
    enforce-elevated-controls: true
    operator-ids: ${ADMIN_USER_DELETION_OPERATOR_IDS:}
    recent-auth-window: ${ADMIN_USER_DELETION_RECENT_AUTH_WINDOW:10m}
  observability:
    # Required for Prometheus scrapes even when the endpoint is reachable only
    # over the Docker network. Do not use the development fallback in production.
    metrics-token: ${OBSERVABILITY_METRICS_TOKEN}
  cors:
    # Production should explicitly list allowed frontend origins.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allow-credentials: true
  security:
    verification-code-pepper: ${VERIFICATION_CODE_PEPPER}
    jwt:
      # Required only while legacy HS256 acceptance remains active.
      secret: ${JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:gyro-api}
      audience: ${APP_JWT_AUDIENCE:gyro}
      ec-private-key: ${JWT_EC_PRIVATE_KEY:}
      ec-public-key: ${JWT_EC_PUBLIC_KEY:}
      legacy-hs256-enabled: ${JWT_LEGACY_HS256_ENABLED:true}
      legacy-hs256-accept-until: ${JWT_LEGACY_HS256_ACCEPT_UNTIL:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_EXPIRATION:30d}
